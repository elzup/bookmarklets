name: Lint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version: ${{ matrix.node-version }}
      - name: npm install, build, and test
        run: |
          yarn
          yarn test
        env:
          CI: true
